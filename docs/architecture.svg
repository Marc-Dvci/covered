<svg xmlns="http://www.w3.org/2000/svg" width="860" height="760" viewBox="0 0 860 760" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" fill="#14213d">
  <rect width="860" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4a66"/></marker>
  </defs>
  <style>
    .band { font-size: 14px; font-weight: 700; fill: #5f6b84; letter-spacing: 0.04em; }
    .h { font-size: 16px; font-weight: 700; }
    .t { font-size: 14.5px; fill: #3d4a66; }
    .box { fill: #ffffff; stroke: #14213d; stroke-width: 1.5; rx: 8; }
    .code { fill: #e8f0fd; stroke: #1d5fd0; stroke-width: 1.5; rx: 8; }
    .model { fill: #f0eafb; stroke: #6d3fc0; stroke-width: 1.5; rx: 8; }
    .pp { fill: #e5f4eb; stroke: #137a3f; stroke-width: 1.5; rx: 8; }
    .ln { stroke: #3d4a66; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>

  <text class="band" x="24" y="30">PEOPLE</text>
  <rect class="box" x="24" y="42" width="330" height="72"/>
  <text class="h" x="40" y="68">Coordinator: the week</text>
  <text class="t" x="40" y="94">Bryntum Scheduler Enterprise, drag guard</text>
  <rect class="box" x="370" y="42" width="225" height="72"/>
  <text class="h" x="386" y="68">Member's phone</text>
  <text class="t" x="386" y="94">check in, check out, pay</text>
  <rect class="box" x="611" y="42" width="225" height="72"/>
  <text class="h" x="627" y="68">Household's phone</text>
  <text class="t" x="627" y="94">agreement, consent, fee</text>

  <path class="ln" d="M430 114V146"/>
  <text class="band" x="24" y="136">CLOUDFLARE</text>
  <rect class="box" x="24" y="148" width="812" height="44"/>
  <text class="h" x="40" y="176">Pages</text>
  <text class="t" x="100" y="176">the front end, and /api/* forwarded to the Worker by a service binding</text>
  <path class="ln" d="M430 192V214"/>

  <rect class="box" x="24" y="216" width="812" height="212"/>
  <text class="h" x="40" y="242">API Worker (Hono)</text>
  <rect class="code" x="40" y="256" width="430" height="156"/>
  <text class="h" x="56" y="282" fill="#1d5fd0">Code decides</text>
  <text class="t" x="56" y="308">every amount and fee: 40 pay rules</text>
  <text class="t" x="56" y="332">who can cover: solver, also the drag guard</text>
  <text class="t" x="56" y="356">whether an agreement can be signed</text>
  <text class="t" x="56" y="380">whether a model's numbers are the code's</text>
  <rect class="model" x="500" y="256" width="320" height="156"/>
  <text class="h" x="516" y="282" fill="#6d3fc0">Gemini handles words</text>
  <text class="t" x="516" y="308">reads a member's message</text>
  <text class="t" x="516" y="332">chooses among the solver's plans</text>
  <text class="t" x="516" y="356">writes in each person's language</text>
  <text class="t" x="516" y="380">drafts from text and voice notes</text>
  <path class="ln" d="M500 322H472"/>

  <path class="ln" d="M180 428V452"/>
  <path class="ln" d="M550 428V452"/>
  <rect class="box" x="24" y="454" width="300" height="100"/>
  <text class="h" x="40" y="482">Ledger</text>
  <text class="t" x="40" y="508">one Durable Object with SQLite:</text>
  <text class="t" x="40" y="532">visits, money rows, events</text>
  <rect class="box" x="340" y="454" width="496" height="100"/>
  <text class="h" x="356" y="482">Workflows: one per money task, each step retried</text>
  <text class="t" x="356" y="508">place the hold · capture and pay · check the payout</text>
  <text class="t" x="356" y="532">a cron trigger starts the sweep every 5 minutes</text>
  <path class="ln" d="M340 504H326"/>
  <path class="ln" d="M588 554V588"/>

  <text class="band" x="24" y="578">PAYPAL SANDBOX</text>
  <rect class="pp" x="24" y="590" width="812" height="146"/>
  <text class="h" x="40" y="618" fill="#137a3f">PayPal Server SDK, generated by APIMatic</text>
  <text class="t" x="40" y="644">Vault v3: the household saves PayPal once</text>
  <text class="t" x="440" y="644">Orders v2: the hold, 24 hours ahead, buyer absent</text>
  <text class="t" x="40" y="668">Payments: capture, partial capture, void</text>
  <text class="t" x="440" y="668">Transaction Search: reconciles the statement</text>
  <text class="h" x="40" y="698" fill="#137a3f">REST</text>
  <text class="t" x="90" y="698">Payouts: the member's pay, polled until final</text>
  <text class="t" x="90" y="722">Webhooks: kept only when PayPal confirms the signature</text>
</svg>
