# Render Blueprint: web service, Postgres and the cron job that asks the workflow to sweep.
# The Workflow service (start command `node --import tsx server/workflows.ts`) is created in the
# dashboard or with the Render CLI, since Workflows are not part of Blueprints yet; see README.
services:
  - type: web
    name: covered-web
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: covered-db
          property: connectionString
      - key: COVERED_LINK_SECRET
        generateValue: true
      - key: COVERED_DEMO
        value: "1"
      - key: COVERED_AI_UNTIL
        value: "2026-12-21"
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: COVERED_DEMO_VAULT_ID
        sync: false
      - key: COVERED_SANDBOX_PAYOUTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: COVERED_WORKFLOW_SLUG
        value: covered-workflows
  - type: cron
    name: covered-sweep
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: node --import tsx server/cron.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        sync: false
      - key: COVERED_WORKFLOW_SLUG
        value: covered-workflows

databases:
  - name: covered-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
